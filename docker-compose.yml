services:
  mongodb:
    image: mongo:7.0
    container_name: todo-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: todo_list
    volumes:
      - mongodb_data:/data/db
    networks:
      - todo-network
    command: --logpath /dev/null

  seed:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: todo-seed
    restart: "no"
    environment:
      - NODE_ENV=development
      - MONGODB_URI=mongodb://mongodb:27017/todo_list
    depends_on:
      - mongodb
    networks:
      - todo-network
    command: ["node", "dist/scripts/seed.js"]

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: todo-server
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - APP_PORT=3000
      - MONGODB_URI=mongodb://mongodb:27017/todo_list
    depends_on:
      - mongodb
      - seed
    networks:
      - todo-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: todo-client
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_ENDPOINT=http://localhost:3000
    depends_on:
      - server
    networks:
      - todo-network

volumes:
  mongodb_data:

networks:
  todo-network:
    driver: bridge
